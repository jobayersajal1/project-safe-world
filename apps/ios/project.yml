name: SafeWorld
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  # Matches the four languages Android ships (values, values-bn, values-es,
  # values-ar). Without this XcodeGen writes only `en` and the other three
  # localizations in Localizable.xcstrings are compiled but never selectable.
  knownRegions:
    - en
    - bn
    - es
    - ar
  developmentLanguage: en

packages:
  SafeWorldCore:
    path: SafeWorldCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.3"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SafeWorld:
    type: application
    platform: iOS
    sources:
      - path: SafeWorld
        excludes:
          - "*.entitlements"
    info:
      path: SafeWorld/Info.plist
      properties:
        CFBundleDisplayName: Safe World
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # Must be stated here, not just in `settings` above: XcodeGen rewrites
        # this plist wholesale and fills unlisted keys with its own defaults —
        # which for CFBundleShortVersionString is "1.0". The update check
        # compares that string against the newest release tag, so leaving it at
        # the default made a 0.1.0 build claim to be 1.0 and quietly conclude it
        # was newer than every release ever published.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same reason as the key above — the plist is rewritten wholesale, so a
        # language not listed here is one iOS will never offer, however complete
        # its translations are in Localizable.xcstrings.
        CFBundleLocalizations:
          - en
          - bn
          - es
          - ar
    entitlements:
      path: SafeWorld/SafeWorld.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.safeworld.app
        # The host app installs and starts the tunnel, so it needs the same
        # capability as the extension that implements it.
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safeworld.app
        PRODUCT_NAME: SafeWorld
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SafeWorldBlocker
        embed: true
      - target: SafeWorldTunnel
        embed: true
      - package: SafeWorldCore
        product: SafeWorldCore

  SafeWorldBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: SafeWorldBlocker
        excludes:
          - "*.entitlements"
    info:
      path: SafeWorldBlocker/Info.plist
      properties:
        CFBundleDisplayName: Safe World Blocker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: SafeWorldBlocker/SafeWorldBlocker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.safeworld.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safeworld.app.blocker
        PRODUCT_NAME: SafeWorldBlocker
        SKIP_INSTALL: YES
    dependencies:
      - package: SafeWorldCore
        product: SafeWorldCore

  # System-wide DNS filtering. Unlike SafeWorldBlocker, which only affects
  # Safari, this sees every app on the device.
  #
  # Requires the Network Extension capability on the developer account, with
  # packet-tunnel-provider approved by Apple. Cannot be built or run in the
  # Simulator — Network Extensions need a real device.
  SafeWorldTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: SafeWorldTunnel
        excludes:
          - "*.entitlements"
    info:
      path: SafeWorldTunnel/Info.plist
      properties:
        CFBundleDisplayName: Safe World Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: SafeWorldTunnel/SafeWorldTunnel.entitlements
      properties:
        # Both of these were missing, and the file was an empty <dict/>. The host
        # app declared them; this target declared neither, which would have failed
        # in two different ways on a correctly provisioned account:
        #
        # - Without the app group, `FilterEngine()` cannot open the App Group
        #   container the host app stages the filters into, so the tunnel would
        #   start and match nothing. Silent: a running tunnel that blocks zero
        #   domains looks exactly like a healthy one.
        # - Without the networkextension entitlement the extension is not a valid
        #   packet-tunnel provider at all and the system refuses to launch it.
        com.apple.security.application-groups:
          - group.com.safeworld.app
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safeworld.app.tunnel
        PRODUCT_NAME: SafeWorldTunnel
        INFOPLIST_KEY_CFBundleDisplayName: Safe World Tunnel
    dependencies:
      - package: SafeWorldCore
        product: SafeWorldCore

schemes:
  SafeWorld:
    build:
      targets:
        SafeWorld: all
        SafeWorldBlocker: all
        SafeWorldTunnel: all
    test:
      targets: []
    run:
      config: Debug
    archive:
      config: Release
