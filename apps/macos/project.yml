name: SafeWorld
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"

packages:
  SafeWorldCore:
    # macOS shares the iOS app's Swift package rather than reimplementing
    # categories/Settings/Matcher/HostsFileBuilder a third time in Swift —
    # SafeWorldCore is pure Foundation and already declares macOS support in
    # its own Package.swift. Regenerate its bundled blocklists the same way
    # iOS does, via `npm run build:ios` at the repo root.
    path: ../ios/SafeWorldCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  SafeWorld:
    type: application
    platform: macOS
    sources:
      - path: SafeWorld
    info:
      path: SafeWorld/Info.plist
      properties:
        CFBundleDisplayName: Safe World
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
        # Must be stated here, not just in `settings` above: XcodeGen rewrites
        # this plist wholesale and fills unlisted keys with its own defaults —
        # which for CFBundleShortVersionString is "1.0". The update check
        # compares that string against the newest release tag, so leaving it at
        # the default made a 0.1.0 build claim to be 1.0 and quietly conclude it
        # was newer than every release ever published.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safeworld.mac
        PRODUCT_NAME: SafeWorld
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SafeWorldCore
        product: SafeWorldCore
    postBuildScripts:
      # Embed the root DNS daemon into the app bundle.
      #
      # Without this the `.dmg` contains no daemon at all, which is why installing it was only
      # possible through `apps/macos/dnsd/safeworld-dnsd.sh` — and why the shipping app blocked the
      # capped 150,000 hosts-file list instead of the 4,482,470 the filters hold.
      #
      # A SwiftPM *executable* product cannot be embedded as a helper by declaring a dependency the
      # way a library can, so it is built and copied here. `Contents/Helpers` is where
      # `Bundle.main.url(forAuxiliaryExecutable:)` looks.
      - name: Embed safeworld-dnsd
        basedOnDependencyAnalysis: false
        script: |
          set -e
          CORE="$SRCROOT/../ios/SafeWorldCore"
          swift build -c release --package-path "$CORE" --product safeworld-dnsd
          BIN="$(swift build -c release --package-path "$CORE" --show-bin-path)/safeworld-dnsd"
          HELPERS="$CODESIGNING_FOLDER_PATH/Contents/Helpers"
          mkdir -p "$HELPERS"
          cp "$BIN" "$HELPERS/safeworld-dnsd"
          chmod 755 "$HELPERS/safeworld-dnsd"

schemes:
  SafeWorld:
    build:
      targets:
        SafeWorld: all
    test:
      targets: []
    run:
      config: Debug
    archive:
      config: Release
