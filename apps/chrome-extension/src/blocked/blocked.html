<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocked — Safe World</title>
  <link rel="stylesheet" href="../ui.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .box { max-width: 440px; text-align: center; }
    .shield { font-size: 56px; }
    .host { font-weight: 600; word-break: break-all; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border); font-size: 12px;
    }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="shield">🛡️</div>
    <h1>Site blocked</h1>
    <p class="muted">Safe World blocked <span class="host" id="host">this site</span>.</p>
    <p><span class="badge" id="category">—</span></p>
    <div class="actions">
      <button class="primary" id="back">Go back to safety</button>
      <button id="allowOnce">Allow this time only</button>
      <button class="danger" id="allowAlways">Always allow this site</button>
    </div>
  </div>
  <script type="module" src="./blocked.ts"></script>
</body>
</html>
