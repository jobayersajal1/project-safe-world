<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe World — Settings</title>
  <link rel="stylesheet" href="../ui.css" />
  <style>
    body { max-width: 640px; margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    header .logo { font-size: 24px; }
    section { margin-bottom: 20px; }
    label.field { display: block; margin-bottom: 6px; font-weight: 600; }
    .hint { font-size: 12px; }
    .saved { color: var(--accent); font-size: 12px; margin-left: 8px; }
    .update-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    input[type="number"] { width: 90px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">🛡️</span>
    <h1>Safe World Settings</h1>
  </header>

  <section class="card">
    <h2>Categories</h2>
    <div id="categories"></div>
  </section>

  <section class="card">
    <h2>Custom lists</h2>
    <label class="field" for="allow">Always allow (one domain per line)</label>
    <textarea id="allow" placeholder="example.com"></textarea>
    <label class="field" for="block" style="margin-top:12px">Always block (one domain per line)</label>
    <textarea id="block" placeholder="badsite.example"></textarea>
  </section>

  <section class="card">
    <h2>Remote updates</h2>
    <p class="hint muted">Optionally fetch fresher blocklists from a URL you trust (JSON).</p>
    <label class="field" for="remoteUrl">Update URL</label>
    <input type="text" id="remoteUrl" placeholder="https://example.com/safe-world-lists.json" />
    <div class="update-row">
      <label for="interval">Every</label>
      <input type="number" id="interval" min="1" max="168" /> <span>hours</span>
      <button id="updateNow">Update now</button>
      <span class="hint muted" id="updateStatus"></span>
    </div>
    <p class="hint muted" id="lastUpdate"></p>
  </section>

  <button class="primary" id="save">Save settings</button>
  <span class="saved" id="saved" hidden>Saved ✓</span>

  <script type="module" src="./options.ts"></script>
</body>
</html>
